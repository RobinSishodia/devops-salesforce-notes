name: Sync Hashnode blog

# Hashnode's bot protection blocks GitHub-hosted runners from reading the blog,
# so a fresh copy of the RSS feed is committed to feed/rss.xml after each new
# post. This workflow converts it to Markdown and updates the README index.
on:
  push:
    branches: [main]
    paths:
      - "feed/rss.xml"
      - "scripts/sync_hashnode.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-blog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install markdownify

      - name: Convert feed to Markdown posts
        env:
          HASHNODE_HOST: sishodiarobin.hashnode.dev
          FEED_FILE: feed/rss.xml
        run: python scripts/sync_hashnode.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A posts README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(blog): sync posts from Hashnode feed"
            git push
          fi
